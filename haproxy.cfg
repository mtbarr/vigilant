defaults
    mode tcp
    timeout connect 2s
    timeout client  30s
    timeout server  30s

frontend main
    bind :9999
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    server api1 api1:8080 check inter 1s fall 2 rise 2
    server api2 api2:8080 check inter 1s fall 2 rise 2
