resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    timeout connect 1s
    timeout client  5s
    timeout server  5s

frontend main
    bind *:9999
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    default-server init-addr libc,none resolvers docker
    server api1 api1:8080 check inter 1s fall 2 rise 2
    server api2 api2:8080 check inter 1s fall 2 rise 2
